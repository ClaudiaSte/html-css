<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
         div.container {
            display: flex;
            
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: #4CAF50;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

        div#i1 {
            order: 0;
        }
        div#i2 {
            order: -2;
        }
        div#i3 {
            order: 4;
        }
        div#i4 {
            order: 8;
        }
        div#i5 {
            order: 2;
        }
        div#i6 {
            order: 0;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="item"id="i1">Item 1</div>
        <div class="item"id="i2">Item 2</div>
        <div class="item"id="i3">Item 3</div>
        <div class="item"id="i4">Item 4</div>
        <div class="item"id="i5">Item 5</div>
        <div class="item"id="i6">Item 6</div>
    </div>
</body>
</html>
