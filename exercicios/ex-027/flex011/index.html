<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: burlywood;
            display: flex;
            flex-direction: row nowrap;
        }

        div.item {
            background-color: #4CAF50;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;

        }

        div#cxa {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#cxb {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#cxc {
            flex-shrink: 1;
            flex-grow: 1;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="item" id="cxa">Item 1</div>
        <div class="item" id="cxb">Item 2</div>
        <div class="item" id="cxc">Item 3</div>
    </div>
</body>

</html>
