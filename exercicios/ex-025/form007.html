<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 007</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
       <p>
        <label for="iest">Estado</label>
        <select name="estado" id="iest">
            <optgroup label="Região Sul">
                <option value="SP" selected>São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
                <option value="ES">Espírito Santo</option>
            </optgroup>

            <optgroup label="Região Nordeste">
                <option value="RN">Rio Grande do Norte</option>
                <option value="PB">Paraíba</option>
                <option value="PE">Pernambuco</option>
                <option value="AL">Alagoas</option>
                <option value="SE">Sergipe</option>
            </optgroup>
        </select>
       </p>

       <p>
        <label for="iprof">Profissão</label>
        <input type="text" name="prof" id="iprof" list="lctprof">
        <datalist id="lctprof">
            <option value="ADM">Administrador</option>
            <option value="ENF">Enfermeiro</option>
            <option value="MED">Médico</option>
            <option value="TEC">Técnico de Enfermagem</option>
            <option value="OUT">Outros</option>
        </datalist>
       </p>

       <p>
        <label for="imsg">Mensagem</label><br>
        <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Deixe sua mensagem aqui.."></textarea>
       </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
</body>
</html>
