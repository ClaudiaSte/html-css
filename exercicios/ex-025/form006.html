<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="icor">Cor:</label>
            <input type="color" id="icor" name="cor" value="#ff00ff">
        </p>

        <p>
            <label for="inivel">Nivel de Satisfação:</label>
            <input type="range" id="inivel" name="nivel" min="0" max="10" step="1">
        </p>

        <p>
            <label for="ifoto">Foto de Perfil:</label>
            <input type="file" id="ifoto" name="foto">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
