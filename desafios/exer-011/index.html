<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronauta</title>
    <style>
        body, html{
            margin: 0;
            padding: 0;
            height: 100%;
        }
        .container{
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .fundo{
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .astronauta{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            width: 250px;

        }
        

    </style>
</head>
<body>
    <div class="container">
        <img src="espaco.jpg" class="fundo" alt="img de fundo">
        <img src="astronauta.png" class="astronauta" alt="Astronauta">
    </div>
</body>
</html>
