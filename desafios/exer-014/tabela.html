<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, sans-serif;
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <caption>
            Notas dos Alunos
        </caption>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
            <tbody>
                <tr>
                    <th rowspan="4">Exatas</th>
                    <td>Matemática</td>
                    <td>7.4</td>
                    <td>9.1</td>
                    <td>8.2</td>
                </tr>
                <tr>
                    <td>Física</td>
                    <td>6.0</td>
                    <td>4.3</td>
                    <td>5.2</td>
                </tr>
                <tr>
                    <td>Química</td>
                    <td>8.8</td>
                    <td>7.5</td>
                    <td>81</td>
                </tr>
                <tr>
                    <td>Biologia</td>
                    <td>9.3</td>
                    <td>6.4</td>
                    <td>7.8</td>
                </tr>
                <tr>
                    <th colspan="4">Média de Exatas</th>
                    <td>7.3</td>
                </tr>
                <tr>
                    <th rowspan="2">Humanas</th>
                    <td>História</td>
                    <td>6.8</td>
                    <td>9.5</td>
                    <td>8.1</td>
                </tr>
                <tr>
                    <td>Geografia</td>
                    <td>7.0</td>
                    <td>8.3</td>
                    <td>7.6</td>
                </tr>
                <tr>
                    <th colspan="4">Média de Humanas</th>
                    <td>7.8</td>
                </tr>
            </tbody>
        
    </table>
</body>
</html>
